  <g opacity=".2" filter="url(#blur24)">
    <ellipse cx="1050" cy="686" rx="290" ry="82" fill="#183d31"/>
  </g>

  <rect x="0" y="0" width="760" height="900" fill="url(#mist)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>