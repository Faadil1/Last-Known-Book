<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Refined alpine evidence landscape</title>
  <desc id="desc">A quiet ivory mountain valley, pine forest, river and stone bridge used as the atmospheric background for the Last Known Book interactive archive.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset=".52" stop-color="#e8e5da"/>
      <stop offset="1" stop-color="#c9d2c7"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cec6"/>
      <stop offset="1" stop-color="#9fac9f"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9eaa9c"/>
      <stop offset="1" stop-color="#718273"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe5dc"/>
      <stop offset=".5" stop-color="#c4d0c7"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf8" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#fffdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fffdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7d8" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#f7e9b2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f7e9b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1330" cy="210" r="145" fill="url(#sun)"/>

