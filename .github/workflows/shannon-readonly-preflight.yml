name: Shannon Read-Only Proof Preflight

on:
  pull_request:
    paths:
      - 'scripts/shannon-proof-preflight.mjs'
      - '.github/workflows/shannon-readonly-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned DreamDEX SDK read dependencies
        run: npm install --no-save --ignore-scripts @somnia-chain/markets-sdk@0.29.0 viem@2.37.5
      - name: Read live Shannon Event Contract state
        env:
          INDEXER_URL: https://dev.smk.somnia.host/v1/graphql
          WS_RPC_URL: wss://api.infra.testnet.somnia.network/ws
          MIN_HEADROOM_SEC: '600'
        run: node scripts/shannon-proof-preflight.mjs
      - name: Upload read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lkb-shannon-readonly-preflight
          path: evidence/shannon/preflight.json
          if-no-files-found: warn
          retention-days: 7
