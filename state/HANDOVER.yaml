material_decisions:
  - The user rejected the previous UI/UX as not selling the final product strongly enough and selected `The Atlas Room` as the new visual direction.
  - The approved reference is a directional prototype only. It must not be shipped as a flattened screenshot.
  - Atlas Room V4 is implemented on a new reversible branch `rework/atlas-room-v4` based on the already agent-native HS-002 branch, so the strongest product functionality is preserved.
  - `atlas-room.css` and `atlas-room.js` transition the existing hero/interactions rather than replacing the investigation engine.
  - The hero now uses an external real photographic Unsplash asset at runtime instead of rebuilding the previous screenshot-like hero from repository base64 chunks.
  - Real photographic assets are also used for Atlas index panels and visual case dossiers. These images are context illustration only and are explicitly not incident evidence.
  - `hero-interactions.js` still preserves the real LKB-001 through LKB-004 case navigation, subtle parallax, keyboard interaction and prefers-reduced-motion behavior, then loads the Atlas transition layer.
  - `Methodology` no longer scrolls to a hidden tab that appears empty. It routes to `/methodology.html`, a real judge-facing methodology room exposing Capture -> Reconstruct -> Classify -> Explain -> Decide and OBSERVED / INFERRED / UNKNOWN.
  - `Proof` no longer sends the judge directly to raw commitment data. It routes to `/proof.html`, which explains the real Shannon behavior proof, truth boundary and renders `/evidence/SHANNON-PROOF-003-COMMITMENT.json` as live HTML plus inspectable JSON.
  - Agent Interface is promoted into the primary navigation and Atlas index so the agent-native differentiator is not buried.
  - A DreamDEX load-bearing note now explains marketId, lifecycle, MINT_A_PAIR, resting escrow and native order events before the detailed workspace.
  - The previous visible `12.4M+`, `320+` and `AND COUNTING` vanity metrics were not grounded in the preserved evidence package. Atlas V4 hides that strip and replaces it with truthful judge-safe facts: Shannon 50312, four captured incident classes, inference cannot spend, API/MCP/CLI.
  - Existing HS-002 functionality remains intact: Bring Your Own Incident, generic webhook intake, deterministic Authority Receipt, MCP, CLI, read-only Shannon watcher, decimal normalization and reproduce-case tool.
  - No browser wallet, private-key path, signing, broadcast, automatic compensating trade or mainnet write is introduced.
  - No production reliability, ROI, MTTR improvement, incident prevalence or fraud-detection claim is added.
  - The primary Vercel Hobby account previously hit its rolling 100-deployments/24h limit. The user can manually import the GitHub branch into a second Vercel account.
  - Cloudflare is also available to the user through a connected Codex environment and may be used as an alternate test runtime. This chat has not deployed to Cloudflare and must not claim it has.
  - GitHub remains the canonical source of truth regardless of which preview host is used.

