material_decisions:
  - Atlas Room V5 remains frozen as the final visual direction.
  - The homepage was not expanded; additional proof density lives only in the Proof Room.
  - Proof independence is more valuable than raw transaction count.
  - Four live read-only witnesses are now deployed in Proof Room: Shannon chain/head, public LKB-003 captured receipt, DreamDEX BinaryMarketsModule bytecode and tUSDC decimals().
  - These witnesses are separate from the Last Known Book-originated Packet 003 proof and from the four captured replay cases.
  - The live witness source contract explicitly excludes wallet, signing and transaction-broadcast methods and fails closed if RPC cannot be verified.
  - No additional blockchain write has been authorized.
  - A future product-originated write is only worth considering if it proves a materially different, currently missing DreamDEX semantic path and receives a fresh exact human approval packet.
  - Proof Commitment remains a visual receipt; raw JSON is machine-readable audit evidence only.
  - README, submission package, demo script and Benita handoff are aligned to production `main` and the updated proof taxonomy.
  - Two CI failures on commit 5fdfb530 were stale literal test expectations only. They were replaced by semantic current-contract assertions on ece387c; GitHub Actions then passed.

