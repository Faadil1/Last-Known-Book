latest_material_decisions:
  - A second runtime recording showed that Atlas V4 was still too dense for a first-time jury.
  - The problem was information architecture rather than missing functionality: the root repeated investigation through the hero, a four-path index, Featured Investigations and then the entire case workspace.
  - Atlas V5 changes the root into a jury-first product overview and moves detailed investigation work behind the Case Room.
  - The duplicated four-path index is removed from the root.
  - Featured Investigations is retained but renamed Featured Case Files so it functions as concrete examples rather than another generic investigation section.
  - The default root no longer displays the full investigation workspace.
  - `/investigations.html` is the semantic Case Room entry and redirects into the canonical `?case=LKB-*` workspace.
  - Hero wording now explains the product directly: `POST-EXECUTION INCIDENT RESPONSE · DREAMDEX` and `Know what happened before your agent acts again.`
  - The first explanatory section uses three jury questions: what happened, what is actually known, and what is safe to do next.
  - Methodology, Proof, Agent and Docs remain dedicated pages; depth is intentionally distributed across pages instead of being repeated on the root.
  - Mobile responsiveness is now explicitly load-bearing. Desktop navigation collapses to a native details menu; explainer/cards/workspace/proof layouts reflow at 980px and 680px breakpoints.
  - The prior approved hero asset remains recoverable for provenance/rollback but is not the active root design.
  - Real photographic imagery remains context, never evidence.
  - No promotion toward main is authorized until desktop + mobile runtime receive human and TRACE PASS.

