material_decisions:
  - Atlas Room V5 remains the final selected visual direction.
  - The homepage remains jury-first; no new feature section was added there.
  - The Proof Room is the only product surface expanded in this step.
  - Proof quality and independence are more valuable than raw on-chain transaction count.
  - A second identical PostOnly transaction is not considered a meaningful evidence upgrade.
  - Four live read-only witnesses were added to the Proof Room: Shannon chain/head, public LKB-003 captured receipt, DreamDEX BinaryMarketsModule bytecode and tUSDC decimals().
  - The live witnesses are explicitly separate from the Last Known Book-originated Packet 003 behavior proof.
  - Live witnesses use only read-only JSON-RPC and fail closed when unavailable.
  - No new blockchain write is authorized by this workstream step.
  - Any future product-originated write requires a fresh exact human approval packet and must prove a materially different missing semantic claim.
  - Proof Commitment remains a visual receipt; raw JSON is machine-readable evidence only and is not rendered or linked as the primary judge experience.
  - Submission package, README, canonical demo script and Benita handoff were refreshed to remove stale runtime / next-build claims and align proof taxonomy.

