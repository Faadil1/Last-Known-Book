material_decisions:
  - Atlas Room V5 remains frozen as the final jury-first visual direction.
  - The homepage remains concise; the evidence-density expansion lives in Proof Room and Judge Packet.
  - Proof quality and independence are more valuable than raw transaction count.
  - Four live read-only Shannon witnesses are implemented and deployed: chain/head, public LKB-003 captured receipt, DreamDEX BinaryMarketsModule bytecode and tUSDC decimals().
  - The live witnesses are current read-only verification, not additional Last Known Book-originated trades.
  - Product-originated Packet 003 remains the bounded real Shannon behavior proof.
  - Captured replay cases, Packet 003, live witnesses and the tamper-evident commitment are four distinct evidence categories and must never be blurred in copy or demo narration.
  - Public live witness source excludes wallet, signing and transaction-broadcast methods and fails closed if RPC cannot be verified.
  - No additional blockchain write is authorized.
  - A future product-originated write is only worth considering if it proves a materially different missing DreamDEX semantic path and receives a fresh exact human approval packet.
  - Proof Commitment remains a visual receipt; raw JSON is machine-readable audit evidence only.
  - Judge Packet now routes Proof -> /proof.html, Commitment -> /proof.html#commitment and Live -> /proof.html#live-witnesses; no direct raw commitment JSON link remains in the Judge Packet source.
  - README, submission package, demo script and Benita handoff are aligned to the production main URL and current evidence taxonomy.
  - Final product head 15caef18 passed GitHub Actions and Cloudflare Pages.

