material_decisions:
  - User authorized implementing all identified hidden spots that materially strengthen differentiation and winning potential, bounded by truth, authority, privacy and legal constraints.
  - HS-002 is isolated on PR #19 into the already-isolated component-polish branch, preserving easy rollback and the existing PR18/PR17 promotion gates.
  - Bring Your Own Incident is implemented through `POST /api/investigate`; canonical captured cases use the deterministic DreamDEX engine, while bare transaction intake is read-only and fails closed rather than inventing venue semantics.
  - `POST /api/incidents` is the stable provider-neutral inbound webhook seam. Slack/Discord-specific adapters are deliberately deferred as downstream conveniences, not core winning mechanism.
  - `LKB-AUTHORITY-RECEIPT-v0.1` makes the authority decision consumable by another machine without executing it. It carries deterministic report/receipt hashes, truth-class counts, blockers, recommended action, `writeAuthorized`, and `executionPerformed:false`.
  - Agent-native access exists via `POST /api/mcp`, local `npm run mcp`, `npm run lkb`, repository `SKILL.md`, judge-facing `/agent.html`, and public GET `/api/agent-status`.
  - Public agent surfaces intentionally expose no private-key, wallet-client, signing, broadcast or protected-write execution path.
  - The read-only Shannon watcher uses `eth_chainId`, `eth_blockNumber`, and `eth_getLogs`; raw logs remain intake candidates until a deterministic decoder establishes DreamDEX semantics.
  - Cross-network normalization guards Shannon 50312/tUSDC/6 decimals against Somnia mainnet 5031/USDso/18 decimals by reading ERC-20 `decimals()` through `eth_call` rather than carrying a testnet scale assumption forward.
  - Exact unit conversion uses decimal strings and BigInt.
  - Canonical case reproduction is exposed to agents through `lkb_reproduce_case`, backed by existing `npm run replay` + `npm test` determinism.
  - Judge discoverability was reinforced after the first HS-002 pass: `docs-interactions.js` now adds the Agent Interface to the Judge Fast Lane and evidence/source cards, so the differentiator is not buried in README/API documentation.
  - Final HS-002 implementation head `25f083b4e0f2c8efad79f99b5bcb9b586b8700db` passed CI run `34509507704`. Vercel reports the branch preview Ready with deployment `5j13ZPzmt2pqTjmNfbrru2RJH75B`.
  - Vercel Ready is not being conflated with runtime endpoint/visual PASS because connected content fetching for this preview is unavailable. Human/browser runtime review remains required.
  - Upstream sponsor-feedback publication was retried against `somnia-chain/dreamdex-bot-kit` after an obvious-duplicate search. GitHub again returned 403 Resource not accessible by integration; no issue publication is claimed.
  - Repository license remains unselected because legal reuse rights require explicit human license choice.
  - Protected write automation remains rejected because exposing it through agent surfaces would weaken the core differentiator.
  - No new blockchain write, mainnet write, Packet 003 private identifier, production reliability claim, ROI claim, MTTR claim, prevalence claim or fraud claim was introduced.
