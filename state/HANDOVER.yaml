material_decisions:
  - User authorized applying all newly identified hidden spots that materially improve differentiation and final-product strength, while preserving truth, safety and legal boundaries.
  - HS-002 is implemented on isolated PR #19 and targets the existing component-polish branch rather than main.
  - The winning product story is now agent-native: `DreamDEX event/tx -> Last Known Book -> OBSERVED/INFERRED/UNKNOWN -> cause or fail-closed UNKNOWN -> safe action -> Authority Receipt -> operator/upstream agent`.
  - `POST /api/investigate` supports canonical captured cases and live transaction intake. Bare transaction receipts never get fabricated DreamDEX causality; without a deterministic semantic decoder the system stays UNKNOWN and returns RETRY_READ/ESCALATE with no write authority.
  - `POST /api/incidents` is a provider-neutral operational webhook. Slack/Discord-specific adapters are deliberately deferred because the generic seam is stronger, less secret-dependent and easier to extend after the hackathon.
  - `LKB-AUTHORITY-RECEIPT-v0.1` is deterministic and machine-readable. It includes report/receipt hashes, truth-class counts, blocking unknowns, recommended action, write authorization and `executionPerformed:false`.
  - Agent access exists through `/api/mcp`, local `npm run mcp`, JSON-first `npm run lkb`, repository `SKILL.md`, `/agent.html`, and public GET `/api/agent-status` capability self-test.
  - Public agent surfaces expose investigation/read functionality only. They do not expose private keys, signing, broadcast, wallet clients or the protected blockchain write runner.
  - `scripts/watch-shannon-readonly.mjs` provides the live ingestion seam with `eth_chainId`, `eth_blockNumber`, and `eth_getLogs`; raw logs remain intake candidates until deterministic decoding establishes semantics.
  - Cross-network normalization explicitly guards Shannon chain 50312 / tUSDC 6 decimals vs Somnia mainnet chain 5031 / USDso 18 decimals using read-only `eth_call` to ERC20 `decimals()` before scaling.
  - Exact unit conversion uses decimal strings and BigInt rather than floating-point arithmetic.
  - Canonical cases are agent-reproducible through `lkb_reproduce_case` and the existing `npm run replay` + `npm test` path.
  - CI run 34508962764 passed on implementation head d7e8d047813d992baaee12aca007b8aa57e888b4 after fixing a guard-test false positive. The failed prior run was test-quality noise: it matched the literal safety field `privateKeyAccepted:false`, not an actual private-key path.
  - Vercel reports the PR #19 preview Ready at the stable branch preview URL. Connected runtime-content fetch is unavailable, so Ready is not being misreported as endpoint/visual PASS.
  - Upstream sponsor-feedback publication was retried against `somnia-chain/dreamdex-bot-kit` after checking for an obvious duplicate. GitHub returned `403 Resource not accessible by integration`; therefore no public upstream issue is claimed. The draft remains ready for a manual or differently authorized path.
  - Repository license is still deliberately unselected because it changes legal reuse rights and needs explicit human license choice.
  - Protected write automation remains explicitly excluded because it would weaken the central authority differentiator.
  - No new blockchain write, mainnet write, Packet 003 private identifier, production-reliability claim, ROI claim, MTTR claim or fraud claim was introduced.
