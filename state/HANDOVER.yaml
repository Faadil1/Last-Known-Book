material_decisions:
  - The user authorized applying all discovered hidden spots that materially improve the final product and strengthen differentiation, while preserving safety and truth boundaries.
  - HS-002 is isolated on `feature/hidden-spots-002-agent-native`, branched from the latest component-polish branch so hero and visual work remain reversible.
  - A live **Bring your own incident** section now accepts txHash, marketId and agent intent through a read-only HTTP intake. Minimal evidence deliberately returns `EVIDENCE_REQUIRED` + `RETRY_READ` and never fabricates a root cause.
  - `src/agent-native.mjs` creates deterministic `LKB-AUTHORITY-RECEIPT-v0.1` receipts with report hash, root cause, safe next action, explicit `writeAuthorized`, truth-class counts, receipt hash and the authority marker `MODEL_INFERENCE_ALONE_CANNOT_AUTHORIZE_FUNDS`.
  - `scripts/lkb-mcp.mjs` exposes read-only MCP tools `investigate_incident`, `evaluate_authority`, and `get_safe_action` for agent runtimes.
  - `scripts/investigate.mjs` exposes machine-readable CLI investigation via `npm run investigate -- <incident.json>`.
  - `POST /api/incident-webhook` provides generic operational intake without arbitrary outbound callbacks, avoiding turning the public demo into a relay/SSRF surface.
  - Slack and Discord notification payload adapters are generated from the bounded Authority Receipt; the public demo does not send external notifications automatically.
  - `scripts/watch-dreamdex.mjs` adds read-only JSON-RPC event ingestion using `eth_blockNumber` + `eth_getLogs`; raw logs remain intake evidence and do not become causal claims until reconstruction.
  - `scripts/read-token-decimals.mjs` dynamically reads ERC20 `decimals()` over JSON-RPC. `normalizeTokenAmount` is tested with 6- and 18-decimal values so Shannon/mainnet scale is not assumed.
  - The investigation toolbar gains a **Reproduce** action that copies the deterministic replay command for the current case.
  - Tests explicitly guard fail-closed BYOI behavior, deterministic authority receipts, decimal normalization, bounded notification payloads and absence of signing/broadcast primitives from the agent-native surfaces.
  - The component-polish direction, physical-binder hero, four canonical cases, real Shannon proof rail, live read-only Shannon readback and `/docs.html` remain protected.
  - HS-002 does not add a repository license because that changes legal reuse rights and needs explicit human policy choice.
  - HS-002 does not claim the sponsor/upstream issue has been published; the draft exists but third-party GitHub write authority remains unavailable.
  - No wallet connection, private-key path, automatic compensating trade, mainnet write, Packet 003 de-redaction or model-authorized spend was added.
product_differentiation_story:
  flow: DREAMDEX_EVENT_OR_AGENT_INCIDENT -> READ_ONLY_INTAKE -> RECONSTRUCTION -> OBSERVED_INFERRED_UNKNOWN -> AUTHORITY_RECEIPT -> OPERATOR_OR_MCP_OR_CLI_OR_WEBHOOK
  key_line: The trading agent may be AI. The layer that decides whether money moves is not.
  judge_value:
    - product can ingest a new incident rather than only replay four fixed cases
    - downstream agents can consume a bounded authority decision through MCP/CLI/HTTP
    - live events have a truthful read-only ingestion path
    - reproducibility is evaluator-visible
    - cross-network collateral scale is guarded dynamically rather than assumed
