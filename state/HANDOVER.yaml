final_material_decisions:
  - Atlas Room V5 is the selected final visual direction.
  - The home is jury-first; the complete operational workspace is behind the Case Room.
  - Featured Case Files stay as concrete examples, not another generic investigation section.
  - Methodology, Proof, Agent and Docs are separate depth pages.
  - Home-to-Case-Room navigation must never flash the pre-Atlas hero; it now transitions inside the existing live DOM with history.pushState.
  - Proof Commitment must read like a first-class product surface, not Markdown or raw JSON.
  - `/proof.html#commitment` is the canonical judge-facing commitment receipt.
  - The raw JSON commitment remains publicly available only as a machine-readable evidence artifact and is not rendered by the Proof Room.
  - Legacy raw commitment links in the main product and Judge Packet are routed to the visual receipt.
  - Mobile reactivity, keyboard focus and prefers-reduced-motion are load-bearing acceptance requirements.
  - Real photography is contextual illustration and must never be presented as incident evidence.
  - No LLM inference may authorize funds; no public surface exposes wallet/private key/signing/broadcast authority.
  - Production evidence remains ABSENT; no ROI, MTTR, profitability, prevalence or fraud-detection claim is allowed.

