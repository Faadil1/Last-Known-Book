material_decisions:
  - The user selected `The Atlas Room` as the new canonical visual target because the previous UI/UX did not sell the final product strongly enough.
  - Atlas Room V4 is implemented on its own reversible branch on top of the agent-native HS-002 candidate.
  - The selected concept is not used as one flat screenshot. Atlas Room remains live DOM and preserves the real investigation workspace.
  - Runtime imagery uses direct Unsplash photographic sources. These photographs are contextual editorial illustration only and must never be treated or described as DreamDEX incident evidence.
  - The old seven-part approved hero asset is still preserved in the repository as rollback/provenance, but it is no longer required to remain the active visual surface.
  - `hero-interactions.js` preserves case deep-links, subtle parallax, focus and reduced-motion, then loads the Atlas transition layer.
  - `/methodology.html` fixes the previously weak/empty Methodology destination and exposes Capture -> Reconstruct -> Classify -> Explain -> Decide plus OBSERVED / INFERRED / UNKNOWN.
  - `/proof.html` fixes the raw proof-commitment experience by rendering the real Shannon behavior proof, explicit truth boundary and the public commitment JSON as judge-facing HTML.
  - Agent Interface is now promoted into primary navigation and the Atlas index.
  - The Atlas runtime hides the old unsupported `12.4M+`, `320+`, `AND COUNTING` social-proof strip and replaces it with grounded facts: Shannon 50312, four captured incident classes, inference cannot spend, API/MCP/CLI.
  - The Atlas runtime adds a DreamDEX load-bearing explainer covering marketId, lifecycle, MINT_A_PAIR, resting escrow and native order events.
  - Existing HS-002 remains intact: Bring Your Own Incident, webhook intake, deterministic Authority Receipt, API/MCP/CLI, read-only watcher, normalization guard and reproduce-case tool.
  - The first Atlas PR CI run failed only because an obsolete legacy test asserted that the old seven-part base64 hero loader must remain active. The product code and new Atlas tests otherwise passed.
  - The legacy test was repaired to preserve the prior asset for rollback while allowing the user-approved Atlas Room to own the active runtime.
  - Final GitHub Actions run `34515736267` passed all 36 tests and deterministic replay remained clean.
  - The primary Vercel Hobby account is currently rate-limited after hitting the observed 100-deployments rolling-24h limit. A failed primary Vercel check on PR21 is therefore expected and is not a product failure.
  - The user can import `rework/atlas-room-v4` into a second Vercel account for runtime review.
  - Cloudflare is also available through the user's Codex connection and may be used as an alternate test runtime. This chat has not deployed Atlas Room to Cloudflare and must not claim otherwise.
  - GitHub remains the source of truth regardless of preview host.
  - No browser wallet, private key, signing, broadcast, automatic compensating trade, mainnet write, Packet 003 de-redaction, production reliability claim, ROI claim, MTTR claim, prevalence claim or fraud claim is introduced.

