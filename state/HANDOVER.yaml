material_decisions:
  - User authorized applying every newly identified hidden spot that materially strengthens the final product and improves differentiation, subject to truth/safety/legal boundaries.
  - HS-002 is isolated on `rework/hidden-spots-002-agent-native` so the already-green component-polish candidate remains recoverable.
  - Bring Your Own Incident is now a real product seam: `/api/investigate` accepts canonical case data or live transaction intake. Transaction-only intake reads chain/receipt state and refuses to invent DreamDEX semantic causality without deterministic evidence.
  - `/api/incidents` is the provider-neutral inbound operational webhook. It intentionally avoids Slack/Discord-specific secrets and adapters; those are downstream integrations, not core hackathon mechanism.
  - `LKB-AUTHORITY-RECEIPT-v0.1` makes the authority boundary machine-readable: recommended action, write authorization, truth-class counts, blockers, report hash, receipt hash and `executionPerformed:false`.
  - Agent-native access now exists through `/api/mcp`, local `npm run mcp`, `npm run lkb`, repository `SKILL.md`, and the judge-facing `/agent.html` surface.
  - Agent tools are investigation/read tools only. The protected blockchain write runner is not exposed through browser, HTTP, MCP or CLI.
  - `scripts/watch-shannon-readonly.mjs` adds a read-only live event ingestion seam using `eth_chainId`, `eth_blockNumber` and `eth_getLogs`. Raw events remain intake candidates until deterministic DreamDEX decoding establishes semantics.
  - Cross-network normalization is now explicit and testable. `/api/network-check` uses `eth_call` to read ERC-20 `decimals()` and chain identity; Shannon expects tUSDC/6 on chain 50312, mainnet USDso/18 on chain 5031. No mainnet write is introduced.
  - Unit conversion helpers use decimal strings/BigInt rather than floating-point scaling.
  - `lkb_reproduce_case` exposes the existing deterministic replay path to agents without executing a transaction.
  - `/agent.html` makes the adoption story visible to judges: agent/runtime -> Last Known Book -> truth classes -> root cause/safe action -> Authority Receipt -> operator/upstream agent.
  - Product footer now links the Agent interface while leaving the approved hero and component polish direction intact.
  - Slack/Discord-specific notification adapters are deliberately deferred because the generic webhook provides the stronger architectural seam with less risk and no provider credentials.
  - A repository license is not selected because that changes legal reuse rights and still requires an explicit human license choice.
  - Protected write automation is deliberately not added because it would weaken the product's primary differentiator.
  - Upstream DreamDEX feedback draft remains ready; publication can be retried as a P1 sponsor-facing action after HS-002 validation.
  - No Packet 003 private identifier, private key, wallet connection, automated compensation trade, mainnet transaction, production reliability claim, ROI claim or MTTR claim was added.
